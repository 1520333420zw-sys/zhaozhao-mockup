<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZHAOZHAO 壁纸预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#26354e;font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}main{max-width:960px;margin:auto;padding:24px 16px 50px}h1{text-align:center;font-size:22px;letter-spacing:.07em}p{text-align:center;color:#67758a;line-height:1.6}.panel{background:white;padding:17px;border-radius:18px;margin:15px auto;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:center}.panel label{display:flex;align-items:center;gap:7px}.panel input[type=text]{width:100px;font-size:19px;padding:9px;border:1px solid #cbd4e2;border-radius:9px}.panel input[type=file]{max-width:210px;font-size:12px}.panel button{padding:11px 16px;border:0;border-radius:10px;background:#2b466e;color:white;font:inherit}.panel button.secondary{background:#e5ebf4;color:#26354e}.panel input[type=range]{width:95px}.view{display:flex;flex-wrap:wrap;justify-content:center;gap:18px}.frame{width:min(100%,345px);text-align:center}.frame canvas{display:block;width:100%;height:auto;background:#e1e8f5;border-radius:22px;box-shadow:0 6px 25px #20324c22}.frame h2{font-size:15px;font-weight:500}.hint{font-size:12px;color:#79849a;text-align:center}</style></head><body><main>
<h1>ZHAOZHAO · 壁纸效果图</h1><p>全新简洁版：使用你提供的两张锁屏 / 主屏参考图。<br>先分别导入图片，再修改锁屏时间，其他设计保持原样。</p>
<div class="panel"><label>锁屏参考图 <input id="lockfile" type="file" accept="image/*"></label><label>主屏参考图 <input id="homefile" type="file" accept="image/*"></label></div>
<div class="panel"><label>时间 <input id="clock" type="text" value="11:06" maxlength="5" inputmode="numeric"></label><label>字体大小 <input id="size" type="range" min="120" max="260" value="195"></label><label>字体颜色 <input id="color" type="color" value="#c4ffff"></label><label>字重 <input id="weight" type="range" min="300" max="900" step="100" value="500"></label></div>
<div class="panel"><button id="saveLock">保存锁屏 PNG</button><button id="saveHome">保存主屏 PNG</button><button id="savePair" class="secondary">保存双屏展示图 3:4</button></div>
<div class="view"><div class="frame"><h2>锁屏预览</h2><canvas id="lock" width="710" height="1536"></canvas></div><div class="frame"><h2>主屏预览</h2><canvas id="home" width="915" height="1822"></canvas></div></div>
<p class="hint">图片只在当前设备浏览器处理，不会上传服务器。首次需要选择你发来的两张参考图。</p></main><script>
const $=id=>document.getElementById(id),lc=$('lock'),hc=$('home'),L=lc.getContext('2d'),H=hc.getContext('2d');let lockImg=null,homeImg=null;
function cover(c,img,w,h){let r=Math.max(w/img.width,h/img.height),iw=img.width*r,ih=img.height*r;c.drawImage(img,(w-iw)/2,(h-ih)/2,iw,ih)}
function drawPlaceholder(c,w,h,label){let g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#43c7ed');g.addColorStop(.48,'#71a4f6');g.addColorStop(1,'#9992fb');c.fillStyle=g;c.fillRect(0,0,w,h);c.fillStyle='#ffffffbb';c.textAlign='center';c.font='24px sans-serif';c.fillText(label,w/2,h/2)}
function drawLock(){const w=710,h=1536;L.clearRect(0,0,w,h);if(lockImg)cover(L,lockImg,w,h);else drawPlaceholder(L,w,h,'请上传锁屏参考图');
 if(!lockImg)return;
 // Replace the time only. Rebuild the original smooth gradient underneath using neighboring pixels.
 const top=218,bottom=400;const a=L.getImageData(8,top,1,1).data,b=L.getImageData(8,bottom,1,1).data;
 const g=L.createLinearGradient(0,top,0,bottom);g.addColorStop(0,'rgb('+a[0]+','+a[1]+','+a[2]+')');g.addColorStop(1,'rgb('+b[0]+','+b[1]+','+b[2]+')');L.fillStyle=g;L.fillRect(70,top,565,bottom-top);
 L.save();L.fillStyle=$('color').value;L.textAlign='center';L.textBaseline='middle';L.font=$('weight').value+' '+$('size').value+'px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';L.fillText($('clock').value,355,308,585);L.restore();
}
function drawHome(){H.clearRect(0,0,915,1822);if(homeImg)cover(H,homeImg,915,1822);else drawPlaceholder(H,915,1822,'请上传主屏参考图')}
function load(input,cb){input.addEventListener('change',()=>{const f=input.files[0];if(!f)return;const url=URL.createObjectURL(f),im=new Image();im.onload=()=>{cb(im);URL.revokeObjectURL(url)};im.src=url})}
load($('lockfile'),im=>{lockImg=im;drawLock()});load($('homefile'),im=>{homeImg=im;drawHome()});
['clock','size','color','weight'].forEach(id=>$(id).addEventListener('input',drawLock));
function save(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click()}
$('saveLock').onclick=()=>save(lc,'ZHAOZHAO_lock.png');$('saveHome').onclick=()=>save(hc,'ZHAOZHAO_home.png');
$('savePair').onclick=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1440;const x=c.getContext('2d');x.fillStyle='#fafafa';x.fillRect(0,0,1080,1440);x.save();x.beginPath();x.roundRect(56,95,455,1050,46);x.clip();x.drawImage(lc,56,95,455,1050);x.restore();x.save();x.beginPath();x.roundRect(569,95,455,1050,46);x.clip();x.drawImage(hc,569,95,455,1050);x.restore();save(c,'ZHAOZHAO_pair_3x4.png')};
drawLock();drawHome();
</script></body></html>
