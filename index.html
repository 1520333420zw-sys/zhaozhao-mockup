<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZHAOZHAO 壁纸预览生成器</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fa;color:#25344c;font:15px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}main{max-width:960px;margin:auto;padding:22px 14px 45px}h1{text-align:center;font-size:22px}p{text-align:center;color:#6e7888;line-height:1.6}.panel{background:white;padding:16px;border-radius:17px;margin:15px 0;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}.panel label{display:flex;align-items:center;gap:8px}.panel input[type=text]{width:100px;padding:9px;font-size:18px;border:1px solid #ccd4e0;border-radius:9px}.panel input[type=file]{max-width:220px}.panel button{padding:12px 15px;border:0;border-radius:10px;background:#28446c;color:white;font:inherit;cursor:pointer}.panel button.alt{background:#e7edf6;color:#28446c}.view{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}.frame{width:min(100%,335px);text-align:center}.frame canvas{display:block;width:100%;height:auto;border-radius:23px;box-shadow:0 5px 22px #1a29431f}.frame h2{font-size:15px;font-weight:500}.hint{font-size:12px}</style></head><body><main>
<h1>ZHAOZHAO · 壁纸预览生成器</h1><p>上传一张壁纸，自动生成与你参考图相似的 iPhone 锁屏、主屏和双屏展示图。<br>只替换壁纸内容，不需要再上传两张参考截图。</p>
<div class="panel"><label>① 选择壁纸 <input id="file" type="file" accept="image/*"></label><label>② 锁屏时间 <input id="clock" type="text" value="11:06" maxlength="5" inputmode="numeric"></label><label>日期 <input id="date" type="text" value="11月6日周五" style="width:145px"></label></div>
<div class="panel"><button id="saveLock">下载锁屏图</button><button id="saveHome">下载主屏图</button><button id="savePair" class="alt">下载双手机封面（3:4）</button></div>
<div class="view"><div class="frame"><h2>锁屏预览</h2><canvas id="lock" width="710" height="1536"></canvas></div><div class="frame"><h2>主屏预览</h2><canvas id="home" width="710" height="1536"></canvas></div></div>
<p class="hint">照片仅在你的浏览器内处理，不上传服务器。图标和锁屏界面为展示模拟效果。</p></main><script>
const $=id=>document.getElementById(id),lock=$('lock'),home=$('home'),L=lock.getContext('2d'),H=home.getContext('2d'),W=710,HGT=1536;let art=null;
function round(c,x,y,w,h,r,fill){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=fill;c.fill()}
function txt(c,s,x,y,size,color='#fff',weight=500,align='center'){c.textAlign=align;c.fillStyle=color;c.font=weight+' '+size+'px -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';c.fillText(s,x,y)}
function background(c){c.clearRect(0,0,W,HGT);if(art){const scale=Math.max(W/art.width,HGT/art.height);const w=art.width*scale,h=art.height*scale;c.drawImage(art,(W-w)/2,(HGT-h)/2,w,h)}else{const g=c.createLinearGradient(0,0,0,HGT);g.addColorStop(0,'#48c7e8');g.addColorStop(.45,'#71a7f3');g.addColorStop(1,'#9b90f5');c.fillStyle=g;c.fillRect(0,0,W,HGT)}}
function status(c){txt(c,'中国电信',48,56,24,'#fff',600,'left');for(let i=0;i<4;i++)round(c,552+i*11,51-(8+i*5),7,8+i*5,3,'#fff');c.save();c.strokeStyle='#fff';c.lineWidth=5;c.lineCap='round';for(const [r,a] of [[18,0],[11,0]]){c.beginPath();c.arc(634,48,r,Math.PI*1.21,Math.PI*1.79);c.stroke()}c.beginPath();c.arc(634,49,3,0,7);c.fillStyle='#fff';c.fill();c.restore();round(c,655,31,38,23,7,'#ffffffbb');txt(c,'36',674,49,18,'#3885bd',700);round(c,695,38,4,9,2,'#ffffff99')}
function flashlight(c,x,y){c.save();c.translate(x,y);c.fillStyle='#fff';round(c,-11,-24,22,9,3,'#fff');round(c,-8,-11,16,34,4,'#fff');round(c,-9,-17,18,5,2,'#fff');round(c,-3,-5,6,9,3,'#8a9bdb');c.restore()}
function camera(c,x,y){c.save();c.translate(x,y);round(c,-23,-12,46,35,6,'#fff');round(c,-11,-18,19,9,3,'#fff');c.beginPath();c.arc(0,5,12,0,7);c.fillStyle='#8299c8';c.fill();c.beginPath();c.arc(0,5,8,0,7);c.fillStyle='#fff';c.fill();round(c,13,-6,5,4,2,'#8299c8');c.restore()}
function drawLock(){background(L);status(L);txt(L,$('date').value,355,198,35,'#fff',650);txt(L,$('clock').value,355,370,190,'#f5f8df',750);for(const [x,type] of [[132,'flash'],[578,'camera']]){L.beginPath();L.arc(x,1390,53,0,Math.PI*2);L.fillStyle='#f0f4ff33';L.fill();L.strokeStyle='#ffffff50';L.lineWidth=2;L.stroke();type==='flash'?flashlight(L,x,1390):camera(L,x,1390)}round(L,230,1504,250,8,5,'#fff')}
function drawHome(){background(H);H.save();H.fillStyle='#d4f2ffad';const positions=[[98,145],[270,145],[98,315],[270,315],[98,490],[270,490],[442,490],[614,490],[98,665],[270,665],[442,665],[614,665],[98,840],[270,840],[442,840]];positions.forEach(([x,y])=>round(H,x-57,y-57,114,114,29,'#c8edffb0'));round(H,384,88,286,285,58,'#b7eeffc0');round(H,56,1317,598,174,68,'#d6dcff80');[125,280,435,590].forEach(x=>round(H,x-57,1348,114,114,29,'#e6edffb0'));H.restore()}
function draw(){drawLock();drawHome()}
$('file').addEventListener('change',e=>{const file=e.target.files[0];if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{art=img;draw();URL.revokeObjectURL(url)};img.onerror=()=>{alert('图片读取失败，请换一张图片');URL.revokeObjectURL(url)};img.src=url});['clock','date'].forEach(id=>$(id).addEventListener('input',draw));
function save(c,name){c.toBlob(blob=>{if(!blob)return;const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)},'image/png')}
$('saveLock').onclick=()=>save(lock,'ZHAOZHAO_lock.png');$('saveHome').onclick=()=>save(home,'ZHAOZHAO_home.png');
$('savePair').onclick=()=>{const c=document.createElement('canvas');c.width=1080;c.height=1440;const x=c.getContext('2d');x.fillStyle='#fbfbfb';x.fillRect(0,0,1080,1440);for(const [src,px] of [[lock,65],[home,560]]){x.save();x.beginPath();x.roundRect(px,140,455,985,45);x.clip();x.drawImage(src,px,140,455,985);x.restore()}save(c,'ZHAOZHAO_pair_3x4.png')};draw();
</script></body></html>
